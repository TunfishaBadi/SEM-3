<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>lab4_2</title>
</head>
<body>
    <script>

        n1=parseInt(prompt("Enter the frist number:"));
        n2=parseInt(prompt("Enter the secound number:"));

        count=0;
        for(i=n1; i<=n2; i++){
            for(j=1; j<=i; j++){
                if(i%j==0){
                   count++;
                }
            }
        }

        if(count==2){
            document.write(i+"<br\>");
        }

    </script>
</body>
</html>
