<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>lab4_5</title>
</head>
<body>
    <script>

        n=parseInt(prompt("Eneter two digit number:"));

        n1=Math.floor(n/10);
        n2=n%10;

        ans=1;
        for(i=1; i<=n2; i++){
            ans=ans*n1;
        }

        document.write("answer="+ans);

    </script>
</body>
</html>
