<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>lab3_2</title>
</head>
<body>
    <script>
        n1=parseInt(prompt("Enter the number:"));

        isprime=false

        if(n1==1){
            document.write(1+"is prime number");
        }
        else{
        for(i=2; i<n1; i++){
            if(n1%i==0){
                isprime=true;
                break;
            }
        }
    }
    if(isprime){
        document.write(n1+" is not prime number");
    }
    else{
        document.write(n1+" is prime number");
    }

    </script>
</body>
</html>
