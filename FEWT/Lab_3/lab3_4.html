<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>lab3_4</title>
</head>
<body>
    <script>
        n=parseInt(prompt("Enter the number:"));

        a=0;
        b=1;
        temp=0;
        if(n=1){
            document.write("0");
        }
         else if(n==2){
            document.write("0");
            document.write("1");
        }
        else{
            document.write("0");
        for(i=3; i<=n; i++){
            temp=a+b;
            document.write(temp+" ");
            b=a;
            a=temp;
        }

    }

    </script>
</body>
</html>
