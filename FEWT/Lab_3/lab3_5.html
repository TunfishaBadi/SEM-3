<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>lab3_5</title>
</head>
<body>
    <script>
    n=parseInt(prompt("Enter the number:"));

    temp=n;
    reverse=0;
    digit=0;

    while(n!=0){
        digit=n%10;
        reverse=reverse*10+digit;
        n = Math.floor(n / 10);
    }
    
    if(temp==reverse){
        document.write(temp+" is palindrom number");
    }
    else{
        document.write(temp+" is not palindrom number");
    }
    </script>
</body>
</html>
