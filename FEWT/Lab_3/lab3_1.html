<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>lab3_1</title>
</head>
<body>
    <script>
        n1=parseFloat(prompt("Enter the number one"));
        n2=parseFloat(prompt("Enter the number two"));

        if(n1>=n2){
           a= prompt("Which operation is perfom(+,-,*,/)");

            if(a="+"){
                document.write("add. of number:"+(n1+n2));
            }
            else if(a="-"){
                document.write("sub. of number:"+(n1-n2));
            }
            else if(a="*"){
                document.write("mul. of number:"+(n1*n2));
            }
            else if(a="/"){
                document.write("div. of number:"+(n1/n2));
            }
        }
    </script>
</body>
</html>
