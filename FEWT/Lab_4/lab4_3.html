<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>lab4_3</title>
</head>
<body>
    <script>
        // 12345
        // 1234
        // 123
        // 12
        // 1

        n=parseInt(prompt("emter the number:"));

        for(i=n; i>=1; i--){
            for(j=1; j<=i ;j++){
                document.write(j);
            }
            document.write("<br\>");
        }
        document.write("<hr>");

        // 1
        // 01
        // 101
        // 0101

        for(p=1; p<=n; p++){
            for(q=1; q<=p; q++){
                if(p%2==0){
                    if(q%2==0){
                        document.write("1");
                    }
                    else{
                        document.write("0");
                    }
                }
                else{
                    if(q%2==0){
                        document.write("0");
                    }
                    else{
                        document.write("1");
                    } 
                }
            }
            document.write("<br\>");
    }
    </script>
</body>
</html>
